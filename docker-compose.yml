version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: liquidcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liquidcode
      POSTGRES_PASSWORD: liquidcode_dev_password
      POSTGRES_DB: liquidcode_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquidcode"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liquidcode-network

  # MinIO S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: liquidcode-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - liquidcode-network

  # MinIO Client - для автоматического создания бакетов
  minio-setup:
    image: minio/mc:latest
    container_name: liquidcode-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/problems --ignore-existing;
      /usr/bin/mc mb myminio/problems-public --ignore-existing;
      /usr/bin/mc anonymous set download myminio/problems-public;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - liquidcode-network

  # PgAdmin - опциональный веб-интерфейс для PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: liquidcode-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@liquidcode.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - liquidcode-network
    profiles:
      - tools  # Запускается только с --profile tools

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  liquidcode-network:
    driver: bridge
